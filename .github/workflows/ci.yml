name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.22.2
          - 24.15.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit:run

      - name: Build
        run: npm run build-only

      - name: Verify clean working tree
        run: |
          test -z "$(git status --porcelain --untracked-files=all)" || {
            git status --short
            exit 1
          }

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.2
          cache: npm

      - name: Audit dependencies
        shell: bash
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            echo "Audit attempt ${attempt}/3"

            audit_log="$(mktemp)"

            set +e
            npm audit --package-lock-only --audit-level=high 2>&1 | tee "$audit_log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              rm -f "$audit_log"
              exit 0
            fi

            if grep -Eqi "503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|429 Too Many Requests|network timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|socket hang up|audit endpoint returned an error" "$audit_log"; then
              rm -f "$audit_log"

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
                continue
              fi

              echo "npm audit failed after 3 attempts due to a transient registry/network error."
            else
              rm -f "$audit_log"
              echo "npm audit reported a non-transient failure."
            fi

            exit "$status"
          done
